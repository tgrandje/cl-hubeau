[tool.poetry]
name = "cl-hubeau"
version = "0.12.0"
description = "Hubeau client to collect data from the different APIs"
authors = [
    "Thomas Grandjean <thomas.grandjean@developpement-durable.gouv.fr>",
    "Alica Burlot <alica.burlot@developpement-durable.gouv.fr>",
    "Patrice Sauvage <patrice.sauvage@developpement-durable.gouv.fr>",
    ]
maintainers = [
    "Thomas Grandjean <thomas.grandjean@developpement-durable.gouv.fr>",
    ]
license = "GPL-3.0-or-later"
readme = "README.md"
homepage = "https://tgrandje.github.io/cl-hubeau"
repository = "https://github.com/tgrandje/cl-hubeau/"
documentation = "https://tgrandje.github.io/cl-hubeau"
keywords = ["france", "water", "hydrology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]


[tool.poetry.dependencies]
python = "^3.10"
requests-cache = "^1.2.1"
platformdirs = "^4"
diskcache = "^5"
importlib-metadata = ">=6.8.0,<7.0.0"
pebble = "^5"
pandas = "^2"
tqdm = "^4"
geopandas = "^1"
requests-ratelimiter = "^0"
pynsee = "^0"
french-cities = "^1"
deprecated = "^1"


[tool.poetry.group.dev.dependencies]
spyder = "^6"
pytest = "^9"
black = "^26"
pyqt5-qt5 = "5.15.2"
pyqtwebengine-qt5 = "5.15.2"
matplotlib = "^3"
licensecheck = "^2025"
jupyter = "^1"
pyproj = "^3"
seaborn = "^0"
pre-commit = "^4"
flake8 = "^7"
vulture = "^2"
pytest-cov = "^7"
genbadge = {extras = ["all"], version = "^1"}
pytest-xdist = "^3"
filelock = "^3"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
log_format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
addopts = "--cov-report xml:./reports/coverage/coverage.xml"

[tool.coverage.run]
omit = [
    "tests/*",
    ]

[tool.black]
include = '\.py$'
line-length = 79


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
